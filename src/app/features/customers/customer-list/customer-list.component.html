<div
  class="w-full flex flex-col min-h-screen pb-8 relative overflow-hidden bg-[var(--color-primary-soft-beige)]"
>
  <!-- Top App Header -->
  <app-header [title]="i18n.t('customerList')" [subtitle]="'Manage customers'" [showBack]="false" />

  <div class="px-4.5 pt-4 flex flex-col gap-4">
    <!-- Search and Filters -->
    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
      <!-- Search Field -->
      <app-form-input
        placeholder="Search customers..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearch($event)"
        icon="search"
      />

      <!-- Filters -->
      <div class="flex items-center gap-2">
        <select
          class="bg-white rounded-lg border border-[var(--color-border)] px-4 py-2 text-sm focus:outline-none focus:border-[var(--color-primary)]"
        >
          <option>{{ i18n.t('allCustomers') }}</option>
          <option>{{ i18n.t('activeCustomers') }}</option>
          <option>{{ i18n.t('inactiveCustomers') }}</option>
        </select>
      </div>
    </div>

    <!-- Customers Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      @for (customer of filteredCustomers(); track customer.id) {
        <app-customer-card
          [name]="customer.name"
          [phone]="customer.phone"
          [totalSpent]="customer.totalSpent"
          [visits]="customer.visitCount"
        />
      }
    </div>

    <!-- No Results -->
    @if (filteredCustomers().length === 0 && searchTerm) {
      <p class="text-center text-[12px] text-[#6B7280] py-8">
        {{ i18n.t('noCustomersFound') }}
      </p>
    }
  </div>
</div>
