<button
  type="button"
  (click)="clicked.emit()"
  class="text-left w-full min-h-[68px] bg-white border border-[var(--color-border)] rounded-[16px] px-3.5 flex items-center justify-between gap-3 shadow-xs active:bg-[var(--color-surface)] transition-colors cursor-pointer select-none"
>
  <div class="flex items-center gap-3 min-w-0">
    <div
      class="w-[38px] h-[38px] rounded-full bg-[var(--color-surface-secondary)] text-[var(--color-text-primary)] font-bold text-xs flex items-center justify-center shrink-0"
    >
      {{ initials() }}
    </div>

    <div class="flex flex-col min-w-0">
      <span class="text-[13px] font-bold text-[var(--color-text-primary)] truncate leading-snug">
        {{ name() }}
      </span>
      <span class="text-[11px] text-[var(--color-text-secondary)] truncate leading-tight">
        Last visit {{ lastVisit() }} • {{ visitsCount() }} visits
      </span>
    </div>
  </div>

  <span class="text-[var(--color-text-secondary)] hover:text-[var(--color-text-primary)] shrink-0">
    <app-icon name="chevron-right" [size]="18" />
  </span>
</button>
