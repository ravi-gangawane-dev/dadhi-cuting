<div
  (click)="toggled.emit()"
  class="w-full h-[56px] sm:h-[70px] bg-white border rounded-[16px] sm:rounded-[16px] px-3 sm:px-3.5 flex items-center justify-between gap-3 shadow-sm active:scale-[0.98] transition-all cursor-pointer select-none"
  [class.border-[var(--color-accent)]]="selected()"
  [class.border-[var(--color-border)]]="!selected()"
  [class.bg-[var(--color-surface-secondary)]]="selected()"
>
  <div class="flex items-center gap-3 min-w-0">
    @if (selectable()) {
      <div
        class="w-6 h-6 rounded-full border flex items-center justify-center transition-colors shrink-0"
        [class.bg-[var(--color-primary)]]="selected()"
        [class.border-[var(--color-accent)]]="selected()"
        [class.border-[var(--color-border)]]="!selected()"
        [class.bg-white]="!selected()"
      >
        @if (selected()) {
          <span class="text-white">
            <app-icon name="check" [size]="14" />
          </span>
        }
      </div>
    } @else {
      <div
        class="w-[38px] h-[38px] rounded-full bg-[var(--color-surface-secondary)] text-[var(--color-text-primary)] font-bold text-xs flex items-center justify-center shrink-0"
      >
        {{ codeLetter() }}
      </div>
    }

    <div class="flex flex-col min-w-0">
      <span class="text-[13px] sm:text-sm font-bold text-[var(--color-text-primary)] truncate">
        {{ name() }}
      </span>
      <span class="text-[11px] text-[var(--color-text-secondary)] truncate">
        {{ duration() }} mins • {{ category() }}
      </span>
    </div>
  </div>

  <span class="text-[14px] sm:text-[15px] font-bold text-[var(--color-text-primary)] shrink-0">
    ₹{{ price() }}
  </span>
</div>
